set -g mouse on

# ── Session switcher, board & per-session stage ─────────────────────────────
# Each session sits in a stage, derived from its worktree's PR and overridable
# per session in the `@state` user option. One axis, three views:
#
#   unclassified ·  in-progress ✏️  self-review 🔎  in-review 👀  merged ✅
#   plus experimental 🧪, a parking lot outside the pipeline
#
#   prefix s  fzf popup: browse, switch, live pane preview, set stage, reorder
#             (see session-switcher.sh); `b` there opens the board
#   prefix b  kanban board: cards in stage columns, H/L moves one between them
#             (see session-board.sh); Tab there returns to the list
#   prefix S  native choose-tree fallback (expandable window/pane tree)
#
# choose-tree can only test the raw option, so it shows an emoji for a hand-set
# stage and nothing for a derived one; both popups resolve the derived stage.
bind s display-popup -E -w 90% -h 80% -T " sessions " \
  "~/.config/tmux/session-switcher.sh"
bind b display-popup -E -w 95% -h 85% -T " board " \
  "~/.config/tmux/session-board.sh"
bind S choose-tree -Zs -F "#{?#{==:#{@state},merged},✅ ,#{?#{==:#{@state},in-progress},✏️ ,#{?#{==:#{@state},experimental},🧪 ,#{?#{==:#{@state},in-review},👀 ,#{?#{==:#{@state},self-review},🔎 ,}}}}}#{session_name}: #{session_windows} windows#{?session_attached, (attached),}"

# Set the attached session's stage directly, without opening a popup. C-d clears
# the override, handing the session back to PR-derived staging. The popups use
# the plain letters u/a/s/r/m/e; self-review is C-p here because C-s belongs to
# tmux-resurrect's save.
bind C-u set @state unclassified
bind C-a set @state in-progress
bind C-p set @state self-review
bind C-v set @state in-review
bind C-g set @state merged
bind C-e set @state experimental
bind C-d set -u @state

# ── Windows & splits ────────────────────────────────────────────────────────
# Open new windows and splits in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Vim-aware pane navigation ───────────────────────────────────────────────
# C-h/j/k/l move between panes. If the pane runs (n)vim, the key is passed
# through so nvim-tmux-navigation handles it; otherwise tmux selects the pane,
# re-zooming (resize-pane -Z) when the window was zoomed so nav doesn't unzoom.
# Note: this rebinds C-l away from clear-screen in shell panes — use `prefix l`
# or `clear` if you need it.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'if-shell -F "#{window_zoomed_flag}" "select-pane -L; resize-pane -Z" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'if-shell -F "#{window_zoomed_flag}" "select-pane -D; resize-pane -Z" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'if-shell -F "#{window_zoomed_flag}" "select-pane -U; resize-pane -Z" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'if-shell -F "#{window_zoomed_flag}" "select-pane -R; resize-pane -Z" "select-pane -R"'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'if-shell -F "#{window_zoomed_flag}" "select-pane -l; resize-pane -Z" "select-pane -l"'

# ── Plugins (managed by TPM) ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore pane contents and running programs, not just layout
set -g @resurrect-capture-pane-contents 'on'

# `~` prefix restores each program's full saved command line, including args
set -g @resurrect-processes '"~claude" "~codex"'

# Auto-save every 15 min and auto-restore the last session on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Keep this line last
run '~/.config/tmux/plugins/tpm/tpm'
